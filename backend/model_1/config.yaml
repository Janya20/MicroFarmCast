data:
  input_csv: data/demo_microclimate.csv
  artifact_dir: artifacts
training:
  seed: 17
  xgboost:
    n_estimators: 100
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.9
    colsample_bytree: 0.9
    reg_lambda: 1.0
    n_jobs: 2
    objective: reg:squarederror
  classifier:
    n_estimators: 100
    max_depth: 4
    learning_rate: 0.05
    subsample: 0.9
    colsample_bytree: 0.9
    n_jobs: 2
